[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-mcp"
version = "1.0.0"
description = "A 70-tool OSINT and reconnaissance MCP server: DNS, WHOIS, TLS, IP intel, subdomains, breach metadata, threat intel, real-browser crawling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "n5za" }]
keywords = ["osint", "recon", "mcp", "model-context-protocol", "security", "threat-intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "dnspython>=2.4.0",
    "beautifulsoup4>=4.12.0",
    "cryptography>=42.0.0",
    "playwright>=1.40.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
]

[project.urls]
Homepage = "https://github.com/n5za/osint-mcp"
Issues = "https://github.com/n5za/osint-mcp/issues"

[project.scripts]
osint-mcp = "osint_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["osint_mcp*"]

[tool.setuptools.package-data]
osint_mcp = ["data/*.txt"]
